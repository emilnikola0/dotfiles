o ~/.config/kitty/kitty.conf

# ─── Font ───────────────────────────────────────────────
font_family      MesloLGS Nerd Font
bold_font        MesloLGS Nerd Font Bold
italic_font      MesloLGS Nerd Font Italic
bold_italic_font MesloLGS Nerd Font Bold Italic
font_size 13.0

# ─── Transparency ───────────────────────────────────────
background_opacity 0.75
dynamic_background_opacity yes

# ─── Window ─────────────────────────────────────────────
window_padding_width 6
confirm_os_window_close 0
remember_window_size  yes
initial_window_width  900
initial_window_height 600
window_border_width 1pt
active_border_color   #892f9c
inactive_border_color #444444

# ─── Cursor ─────────────────────────────────────────────
cursor_shape block
cursor_blink_interval 0.5

# ─── Scrollback ─────────────────────────────────────────
scrollback_lines 10000

# ─── Tabs & Splits (native in Kitty) ────────────────────
map ctrl+t new_tab
map ctrl+q close_tab
map ctrl+shift+backslash launch --location=hsplit
map ctrl+shift+enter launch --location=vsplit
map shift+right  neighboring_window right
map shift+left  neighboring_window left
map shift+up  neighboring_window up
map shift+down  neighboring_window down
map ctrl+w close_window
map ctrl+shift+plus  change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+0     change_font_size all 0

enabled_layouts splits, tall, stack

